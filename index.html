<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اپلیکیشن مدیریت کاربردی</title>
    
    <!-- تنظیمات PWA و iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="برنامه‌ریز">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 pb-12">

    <div class="max-w-5xl mx-auto px-4 py-6">
        <!-- هدر اصلی -->
        <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-6 border-b border-slate-200 dark:border-slate-800 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-layer-group text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-l from-brand-600 to-violet-600 bg-clip-text text-transparent">
                        سامانه مدیریت روزانه
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">مدیریت وظایف، یادداشت‌ها و زمان تمرکز</p>
                </div>
            </div>

            <!-- دکمه‌های کنترلی هدر -->
            <div class="flex items-center gap-3">
                <button id="themeToggle" onclick="toggleTheme()" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                </button>
                <div class="text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-600 dark:text-slate-300">
                    <i class="fa-regular fa-clock ml-1 text-brand-500"></i>
                    <span id="currentTime">00:00</span>
                </div>
            </div>
        </header>

        <!-- ناوبری تب‌ها -->
        <div class="bg-white dark:bg-slate-800 p-1.5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-8 sticky top-4 z-10">
            <nav class="grid grid-cols-3 gap-2 text-center text-sm font-medium">
                <button id="tab-btn-tasks" onclick="switchTab('tasks')" 
                    class="tab-btn flex items-center justify-center gap-2 py-3 px-4 rounded-xl transition duration-200 bg-brand-600 text-white font-semibold shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-list-check"></i>
                    <span class="hidden sm:inline">مدیریت</span> کارها
                </button>

                <button id="tab-btn-notes" onclick="switchTab('notes')" 
                    class="tab-btn flex items-center justify-center gap-2 py-3 px-4 rounded-xl transition duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-note-sticky"></i>
                    <span>یادداشت‌ها</span>
                </button>

                <button id="tab-btn-pomodoro" onclick="switchTab('pomodoro')" 
                    class="tab-btn flex items-center justify-center gap-2 py-3 px-4 rounded-xl transition duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span>تمرکز</span>
                </button>
            </nav>
        </div>

        <!-- محتوای تب ۱: مدیریت کارها -->
        <section id="tab-content-tasks" class="tab-content active space-y-6">
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800 dark:text-slate-100">
                    <i class="fa-solid fa-plus-circle text-brand-500"></i>
                    افزودن کار جدید
                </h2>
                <form onsubmit="addTask(event)" class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="taskInput" placeholder="مثلاً: مطالعه کتاب..." required
                        class="flex-1 px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white transition">
                    <select id="taskCategory" class="px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white transition">
                        <option value="کاری">💼 کاری</option>
                        <option value="شخصی">👤 شخصی</option>
                        <option value="آموزش">📚 آموزش</option>
                    </select>
                    <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-medium transition shadow-md shadow-brand-500/20 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-add"></i>
                        افزودن
                    </button>
                </form>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-slate-700">
                    <h3 class="font-bold text-slate-800 dark:text-slate-100">فهرست وظایف</h3>
                    <div class="flex gap-1.5">
                        <button onclick="filterTasks('all')" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium">همه</button>
                        <button onclick="filterTasks('active')" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium">جاری</button>
                        <button onclick="filterTasks('completed')" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium">انجام‌شده</button>
                    </div>
                </div>

                <ul id="taskList" class="space-y-3"></ul>
            </div>
        </section>

        <!-- محتوای تب ۲: دفترچه یادداشت -->
        <section id="tab-content-notes" class="tab-content space-y-6">
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800 dark:text-slate-100">
                    <i class="fa-solid fa-pen-to-square text-violet-500"></i>
                    ثبت یادداشت جدید
                </h2>
                <div class="space-y-3">
                    <input type="text" id="noteTitle" placeholder="عنوان یادداشت..." 
                        class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-violet-500 dark:text-white transition">
                    <textarea id="noteContent" rows="3" placeholder="متن یادداشت..." 
                        class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-violet-500 dark:text-white transition"></textarea>
                    <div class="flex justify-end">
                        <button onclick="addNote()" class="px-6 py-2.5 bg-violet-600 hover:bg-violet-700 text-white rounded-xl font-medium transition shadow-md shadow-violet-500/20 flex items-center gap-2">
                            <i class="fa-solid fa-save"></i>
                            ذخیره
                        </button>
                    </div>
                </div>
            </div>

            <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- محتوای تب ۳: تمرکز -->
        <section id="tab-content-pomodoro" class="tab-content space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm text-center">
                    <h2 class="text-lg font-bold mb-2 text-slate-800 dark:text-slate-100">تایمر تمرکز (پومودورو)</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">۲۵ دقیقه تمرکز بدون حواس‌پرتی</p>

                    <div class="relative w-48 h-48 mx-auto flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-900 border-4 border-brand-500 shadow-inner mb-6">
                        <span id="timerDisplay" class="text-4xl font-extrabold font-mono text-slate-800 dark:text-slate-100">25:00</span>
                    </div>

                    <div class="flex justify-center gap-3">
                        <button id="startTimerBtn" onclick="toggleTimer()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium transition flex items-center gap-2">
                            <i id="timerBtnIcon" class="fa-solid fa-play"></i>
                            <span id="timerBtnText">شروع</span>
                        </button>
                        <button onclick="resetTimer()" class="px-6 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-xl font-medium transition flex items-center gap-2">
                            <i class="fa-solid fa-rotate-left"></i>
                            بازنشانی
                        </button>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-slate-800 dark:text-slate-100 mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">خلاصه عملکرد</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl">
                                <span class="text-xs text-slate-500">کل کارها:</span>
                                <span id="statTotal" class="font-bold">0</span>
                            </div>
                            <div class="flex justify-between items-center bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl">
                                <span class="text-xs text-emerald-600">تکمیل‌شده:</span>
                                <span id="statCompleted" class="font-bold text-emerald-600">0</span>
                            </div>
                            <div class="flex justify-between items-center bg-violet-50 dark:bg-violet-900/20 p-3 rounded-xl">
                                <span class="text-xs text-violet-600">یادداشت‌ها:</span>
                                <span id="statNotes" class="font-bold text-violet-600">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // ثبت Service Worker برای قابلیت PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail:', err));
            });
        }

        let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [
            { id: 1, title: 'طراحی اولیه اپلیکیشن', category: 'کاری', completed: true },
            { id: 2, title: 'مطالعه و تمرکز', category: 'آموزش', completed: false }
        ];

        let notes = JSON.parse(localStorage.getItem('my_notes')) || [
            { id: 1, title: 'یادداشت نمونه', content: 'این یک یادداشت نمونه است.', date: '۱۴۰۲/۰۶/۱۰' }
        ];

        let currentFilter = 'all';
        let timerSeconds = 25 * 60;
        let timerInterval = null;
        let isTimerRunning = false;

        function saveData() {
            localStorage.setItem('my_tasks', JSON.stringify(tasks));
            localStorage.setItem('my_notes', JSON.stringify(notes));
            updateStats();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn flex items-center justify-center gap-2 py-3 px-4 rounded-xl transition duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-700";
            });

            document.getElementById(`tab-content-${tabName}`).classList.add('active');
            const activeBtn = document.getElementById(`tab-btn-${tabName}`);
            activeBtn.className = "tab-btn flex items-center justify-center gap-2 py-3 px-4 rounded-xl transition duration-200 bg-brand-600 text-white font-semibold shadow-md shadow-brand-500/20";
        }

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';

            const filteredTasks = tasks.filter(t => {
                if (currentFilter === 'active') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                return true;
            });

            if (filteredTasks.length === 0) {
                listEl.innerHTML = `<li class="text-center py-6 text-slate-400 text-sm">موردی یافت نشد.</li>`;
                saveData();
                return;
            }

            filteredTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-3.5 rounded-xl border transition ${
                    task.completed 
                        ? 'bg-slate-50 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800 opacity-70' 
                        : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 shadow-sm'
                }`;

                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <button onclick="toggleTask(${task.id})" class="w-6 h-6 rounded-lg border flex items-center justify-center transition ${
                            task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600'
                        }">
                            ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>
                        <span class="text-sm font-medium ${task.completed ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-200'}">
                            ${task.title}
                        </span>
                        <span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400">
                            ${task.category}
                        </span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-slate-400 hover:text-rose-500 transition p-1">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                `;
                listEl.appendChild(li);
            });

            saveData();
        }

        function addTask(e) {
            e.preventDefault();
            const input = document.getElementById('taskInput');
            const category = document.getElementById('taskCategory').value;

            if (!input.value.trim()) return;

            tasks.push({
                id: Date.now(),
                title: input.value.trim(),
                category: category,
                completed: false
            });

            input.value = '';
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        function filterTasks(filter) {
            currentFilter = filter;
            renderTasks();
        }

        function renderNotes() {
            const gridEl = document.getElementById('notesGrid');
            gridEl.innerHTML = '';

            if (notes.length === 0) {
                gridEl.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-sm">یادداشتی وجود ندارد.</div>`;
                saveData();
                return;
            }

            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between";

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-bold text-slate-800 dark:text-slate-100">${note.title}</h3>
                            <button onclick="deleteNote(${note.id})" class="text-slate-400 hover:text-rose-500 transition">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                        <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-4">${note.content}</p>
                    </div>
                    <div class="text-[11px] text-slate-400 border-t border-slate-100 dark:border-slate-700/60 pt-2 text-left" dir="ltr">
                        ${note.date}
                    </div>
                `;
                gridEl.appendChild(card);
            });

            saveData();
        }

        function addNote() {
            const titleEl = document.getElementById('noteTitle');
            const contentEl = document.getElementById('noteContent');

            if (!titleEl.value.trim() || !contentEl.value.trim()) return;

            const now = new Date();
            const dateStr = now.toLocaleDateString('fa-IR');

            notes.unshift({
                id: Date.now(),
                title: titleEl.value.trim(),
                content: contentEl.value.trim(),
                date: dateStr
            });

            titleEl.value = '';
            contentEl.value = '';
            renderNotes();
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            renderNotes();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = tasks.length;
            document.getElementById('statCompleted').innerText = tasks.filter(t => t.completed).length;
            document.getElementById('statNotes').innerText = notes.length;
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const secs = (timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }

        function toggleTimer() {
            const btnText = document.getElementById('timerBtnText');
            const btnIcon = document.getElementById('timerBtnIcon');

            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btnText.innerText = 'ادامه';
                btnIcon.className = 'fa-solid fa-play';
            } else {
                isTimerRunning = true;
                btnText.innerText = 'توقف';
                btnIcon.className = 'fa-solid fa-pause';

                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        btnText.innerText = 'شروع مجدد';
                        btnIcon.className = 'fa-solid fa-play';
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 25 * 60;
            updateTimerDisplay();
            document.getElementById('timerBtnText').innerText = 'شروع';
            document.getElementById('timerBtnIcon').className = 'fa-solid fa-play';
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-lg text-amber-400' : 'fa-solid fa-moon text-lg';
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('currentTime').innerText = timeStr;
        }

        window.onload = function() {
            renderTasks();
            renderNotes();
            updateClock();
            setInterval(updateClock, 1000);
        };
    </script>
</body>
</html>
